name: Release NIF

# Builds the precompiled NIF for each supported (variant × target)
# cell and publishes the resulting tarballs. Two triggers:
#
# * `push` on a bare-semver tag (e.g. 0.3.0) — the publication run.
#   Tarballs and matching `.sha256` sidecars land on a draft GitHub
#   release named after the tag, at the URL mix.exs's
#   `compile.emily_nif` step fetches from.
#
# * `workflow_dispatch` — manual rebuild against any branch. Useful
#   for debugging or reproducing a release without cutting a new
#   tag. Artefacts go to workflow run storage (retention 90 days);
#   no GitHub release is touched and nothing is published to Hex.
#
# Consumers verify each tarball against the SHA256 pinned in
# `native_checksums.txt`, which ships inside the hex package (and is
# thus covered by Hex's package hash in the consumer's mix.lock — a
# trust root independent of the mutable GitHub release). The
# `publish-hex` job regenerates that file with `mix emily.publish` once
# the release is public, then publishes the package; the `.sha256`
# sidecars uploaded here are informational only. See MAINTAINING.md.

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Resolves the target version once and — on tag trigger only —
  # creates the draft release up front so the matrix cells don't race
  # on `gh release create`. On workflow_dispatch the release step is
  # a no-op; there's no tag to create one against.
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history, so the check below can see main.
          fetch-depth: 0

      # Refuse a tag whose commit isn't in main's history, such as one
      # pushed before its release PR merged. This only guards against
      # mistakes: a tag-push run uses the workflow file from the tagged
      # commit, so it can't stop someone who can push tags. The "Release
      # tags" ruleset, which lets only repository admins create release
      # tags, is the actual control (see MAINTAINING.md).
      - name: Check tag is on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "error: tag $GITHUB_REF_NAME ($(git rev-parse HEAD)) is not in main's history" >&2
            exit 1
          fi

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION=$(grep -m1 '@version' mix.exs | awk -F'"' '{print $2}')
            if [[ -z "$VERSION" ]]; then
              echo "error: could not parse @version from mix.exs" >&2
              exit 1
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Create or reuse draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$REPO" \
              --draft \
              --title "Emily $TAG" \
              --notes "Precompiled NIF tarballs for macOS arm64 (AOT + JIT variants)."
          fi

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # AOT runs on macos-14 so the metallib works back to older
          # macOS; JIT runs on macos-26 because MLX's NAX kernel
          # sources transitively include
          # <MetalPerformancePrimitives/MetalPerformancePrimitives.h>,
          # first shipped in the macOS 26.2 SDK.
          - { variant: aot, target: macos-arm64, runs-on: macos-14, min: "14.0", xcode: "16.2" }
          - { variant: jit, target: macos-arm64, runs-on: macos-26, min: "26.2" }
    runs-on: ${{ matrix.runs-on }}
    env:
      MIX_ENV: dev
      EMILY_MLX_VARIANT: ${{ matrix.variant }}
      VERSION: ${{ needs.prepare-release.outputs.version }}
      # Pin the cache to the path the actions/cache step below
      # populates. Without it, mix.exs's macOS default of
      # DARWIN_USER_CACHE_DIR (`/private/var/folders/...`) misses
      # the restored cache and rebuilds MLX from scratch every run.
      EMILY_CACHE: ~/Library/Caches/emily
    steps:
      - uses: actions/checkout@v6

      # MLX >= 0.32.1 Metal kernels use `metal::remove_addrspace_t`, which
      # the Metal stdlib in the macos-14 image's default Xcode (15.4)
      # lacks. 16.2 is the newest Xcode on that image; the deployment
      # target, not the SDK, sets the macOS 14 floor.
      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps
        uses: actions/cache@v5
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      # MLX install dir keyed by the NIF sources, Makefile, build
      # script, and the pinned MLX version in mix.exs.
      - name: Cache MLX install
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/emily
          key: mlx-release-${{ runner.os }}-${{ matrix.variant }}-${{ hashFiles('c_src/**', 'Makefile', 'mix.exs', 'scripts/build-mlx.sh') }}
          restore-keys: mlx-release-${{ runner.os }}-${{ matrix.variant }}-

      - run: mix deps.get

      - run: mix compile

      # Guard the shipped artifact: assert it declares the pinned macOS floor
      # and imports no above-floor libSystem symbols before it's packaged.
      - name: Verify NIF macOS floor
        run: bash scripts/verify-nif-floor.sh _build/dev/lib/emily/priv/libemily.so "${{ matrix.min }}"

      - name: Package NIF tarball
        id: pack
        env:
          VARIANT: ${{ matrix.variant }}
          TARGET: ${{ matrix.target }}
        run: |
          ASSET="emily-nif-${VERSION}-${VARIANT}-${TARGET}.tar.gz"
          PRIV="_build/dev/lib/emily/priv"

          if [[ ! -d "$PRIV" ]]; then
            echo "error: expected $PRIV after mix compile" >&2
            exit 1
          fi

          # Flat tarball (no wrapping dir) — mix.exs's fetch_nif/1
          # extracts with `tar -xzf ... -C priv` and expects files at
          # the top level.
          (cd "$PRIV" && tar czf "$GITHUB_WORKSPACE/$ASSET" libemily.* mlx.metallib)

          shasum -a 256 "$ASSET" > "${ASSET}.sha256"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

          {
            echo "## ${VARIANT}-${TARGET}"
            echo ""
            echo '```'
            cat "${ASSET}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # On tag push, publish to the draft GitHub release so consumers
      # can fetch. On workflow_dispatch, stash as workflow artefacts
      # for maintainer collection — no release side-effects.
      - name: Upload to draft release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.version }}
          REPO: ${{ github.repository }}
          ASSET: ${{ steps.pack.outputs.asset }}
        run: gh release upload "$TAG" "$ASSET" "${ASSET}.sha256" --repo "$REPO" --clobber

      - name: Upload as workflow artefact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.asset }}
          path: |
            ${{ steps.pack.outputs.asset }}
            ${{ steps.pack.outputs.asset }}.sha256
          retention-days: 90

  # Once every matrix cell has uploaded its tarball + sidecar to the
  # draft release, flip the release out of draft so consumers can
  # fetch. `needs: build` requires all matrix cells to succeed; the
  # event guard keeps workflow_dispatch runs (which don't touch a
  # release) from triggering this step.
  publish-release:
    needs: [prepare-release, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Mark release as published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.version }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false

  # Publish the package to Hex once the release is public. `mix
  # emily.publish` hashes the tarballs it downloads from that release into
  # `native_checksums.txt`, which ships inside the package, so consumers
  # still verify the NIF against Hex's package hash rather than the GitHub
  # release.
  #
  # On tag push this publishes, using `HEX_API_KEY` from the `hex`
  # environment (see MAINTAINING.md). On workflow_dispatch it runs every
  # step except the upload: it pins checksums for the current `@version`'s
  # release, then builds the package and docs. That exercises the job
  # without the key, since `mix hex.publish --dry-run` still requires one.
  #
  # macOS because `hex.publish` builds docs, which compiles the project,
  # and in a checkout that builds MLX and the NIF. MIX_ENV=docs matches
  # the preferred env of `emily.publish` and `hex.publish`, so `hex.build`
  # reuses the same compile.
  publish-hex:
    needs: [prepare-release, publish-release]
    # `publish-release` is skipped on workflow_dispatch; `!cancelled()`
    # lets this job still run then, while `needs` keeps it after the
    # release is public on tag push.
    if: >-
      !cancelled() && needs.prepare-release.result == 'success' &&
      (needs.publish-release.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: macos-14
    environment: ${{ github.event_name == 'push' && 'hex' || '' }}
    permissions:
      contents: read
    env:
      MIX_ENV: docs
      EMILY_MLX_VARIANT: aot
      EMILY_CACHE: ~/Library/Caches/emily
      VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      # See the build job: MLX >= 0.32.1 needs Xcode 16 on macos-14.
      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore deps
        uses: actions/cache/restore@v5
        with:
          path: deps
          key: deps-${{ runner.os }}-${{ hashFiles('mix.lock') }}
          restore-keys: deps-${{ runner.os }}-

      # The aot build cell above saves this cache, so it is warm by now.
      - name: Restore MLX install
        uses: actions/cache/restore@v5
        with:
          path: ~/Library/Caches/emily
          key: mlx-release-${{ runner.os }}-aot-${{ hashFiles('c_src/**', 'Makefile', 'mix.exs', 'scripts/build-mlx.sh') }}
          restore-keys: mlx-release-${{ runner.os }}-aot-

      # Hex publishes mix.exs's `@version`, so refuse to publish a tag
      # that doesn't match it.
      - name: Check tag matches @version
        if: github.event_name == 'push'
        run: |
          MIX_VERSION=$(grep -m1 '@version' mix.exs | awk -F'"' '{print $2}')
          if [[ "$MIX_VERSION" != "$VERSION" ]]; then
            echo "error: tag $VERSION does not match mix.exs @version $MIX_VERSION" >&2
            exit 1
          fi

      - run: mix deps.get

      - name: Pin NIF checksums
        run: mix emily.publish

      - name: Build package
        run: mix hex.build

      - name: Publish to Hex
        if: github.event_name == 'push'
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

      - name: Build docs
        if: github.event_name == 'workflow_dispatch'
        run: mix docs
